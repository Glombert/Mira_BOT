# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true

android.useAndroidX=true
# usesCleartextTraffic управляется через manifestPlaceholders в build.gradle
# debug=true (для эмулятора), release=false

# Build only arm64-v8a — достаточно для телефона, экономит 75% времени
reactNativeArchitectures=arm64-v8a

# New Architecture ON (native performance)
newArchEnabled=true

# Hermes JS engine ON (smaller APK, faster startup)
hermesEnabled=true
edgeToEdgeEnabled=false
