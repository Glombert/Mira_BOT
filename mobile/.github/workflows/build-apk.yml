name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 0.6.0)'
        required: false
        default: ''
  push:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode release keystore
        env:
          MIRA_RELEASE_KEYSTORE_B64: ${{ secrets.MIRA_RELEASE_KEYSTORE_B64 }}
        run: |
          echo "$MIRA_RELEASE_KEYSTORE_B64" | base64 -d > android/app/mira-release.keystore

      - name: Build Release APK
        env:
          MIRA_RELEASE_STORE_FILE: mira-release.keystore
          MIRA_RELEASE_STORE_PASSWORD: ${{ secrets.MIRA_RELEASE_STORE_PASSWORD }}
          MIRA_RELEASE_KEY_ALIAS: ${{ secrets.MIRA_RELEASE_KEY_ALIAS }}
          MIRA_RELEASE_KEY_PASSWORD: ${{ secrets.MIRA_RELEASE_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          APK_DIR="android/app/build/outputs/apk/release"
          mkdir -p "${APK_DIR}"
          mv "${APK_DIR}/app-release.apk" "${APK_DIR}/mira-mobile-v${VERSION}.apk" 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mira-mobile-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
